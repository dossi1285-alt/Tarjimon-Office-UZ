name: Preflight Build

on:
  push:
    branches:
      - release/1.0-installer-cleanup
  pull_request:
    branches:
      - release/1.0-installer-cleanup
  workflow_dispatch:

jobs:
  build-preflight:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Preflight
        run: dotnet restore TarjimonOfficeUZ.Setup.Preflight/TarjimonOfficeUZ.Setup.Preflight.csproj

      - name: Build Preflight
        run: dotnet build TarjimonOfficeUZ.Setup.Preflight/TarjimonOfficeUZ.Setup.Preflight.csproj --configuration Debug --no-restore
