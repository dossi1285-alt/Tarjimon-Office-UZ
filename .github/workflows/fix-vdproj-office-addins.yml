name: Fix vdproj Office add-ins

on:
  push:
    branches:
      - release/1.0-installer-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch vdproj
        shell: python
        run: |
          from pathlib import Path
          import uuid

          p = Path('TarjimonOfficeUZ.Setup/TarjimonOfficeUZ.Setup.vdproj')
          s = p.read_text(encoding='utf-8-sig')

          if 'TarjimonOfficeUZ.Word.vsto' in s and 'TarjimonOfficeUZ.Excel.vsto' in s:
              print('Already patched')
              raise SystemExit(0)

          word_guid = 'F15AEEF8-8941-4A46-9BD1-B6FFB7FFE2F7'
          excel_guid = '7CC5D6F9-D93D-4A5C-91F7-B491547C8F68'
          folder = '_FC988B52C8104FB0A30DD85CDBD70EB4'

          def file_block(key, source, target):
              return f'''            "{{1FB2D0AE-D3B9-43D4-B9DD-F88EC61E35DE}}:{key}"
            {{
            "SourcePath" = "8:{source}"
            "TargetName" = "8:{target}"
            "Tag" = "8:"
            "Folder" = "8:{folder}"
            "Condition" = "8:"
            "Transitive" = "11:FALSE"
            "Vital" = "11:TRUE"
            "ReadOnly" = "11:FALSE"
            "Hidden" = "11:FALSE"
            "System" = "11:FALSE"
            "Permanent" = "11:FALSE"
            "SharedLegacy" = "11:FALSE"
            "PackageAs" = "3:1"
            "Register" = "3:1"
            "Exclude" = "11:FALSE"
            "IsDependency" = "11:FALSE"
            "IsolateTo" = "8:"
            }}
'''

          def project_block(key, source, guid):
              return f'''            "{{5259A561-127C-4D43-A0A1-72F10C7B3BF8}}:{key}"
            {{
            "SourcePath" = "8:{source}"
            "TargetName" = "8:"
            "Tag" = "8:"
            "Folder" = "8:{folder}"
            "Condition" = "8:"
            "Transitive" = "11:FALSE"
            "Vital" = "11:TRUE"
            "ReadOnly" = "11:FALSE"
            "Hidden" = "11:FALSE"
            "System" = "11:FALSE"
            "Permanent" = "11:FALSE"
            "SharedLegacy" = "11:FALSE"
            "PackageAs" = "3:1"
            "Register" = "3:1"
            "Exclude" = "11:FALSE"
            "IsDependency" = "11:FALSE"
            "IsolateTo" = "8:"
            "ProjectOutputGroupRegister" = "3:1"
            "OutputConfiguration" = "8:"
            "OutputGroupCanonicalName" = "8:Built"
            "OutputProjectGuid" = "8:{{{guid}}}"
            "ShowKeyOutput" = "11:TRUE"
                "ExcludeFilters"
                {{
                }}
            }}
'''

          def hierarchy(msm, owner):
              return f'''        "Entry"
        {{
        "MsmKey" = "8:{msm}"
        "OwnerKey" = "8:{owner}"
        "MsmSig" = "8:_UNDEFINED"
        }}
'''

          word_proj_key = '_F15AEEF889414A469BD1B6FFB7FFE2F7'
          excel_proj_key = '_7CC5D6F9D93D4A5C91F7B491547C8F68'
          word_vsto_key = '_WORDAADDIN000000000000000000001'
          word_man_key = '_WORDMANIFEST0000000000000000001'
          excel_vsto_key = '_EXCELADDIN00000000000000000001'
          excel_man_key = '_EXCELMANIFEST000000000000000001'

          # Hierarchy: add project outputs as children of the existing TARGETDIR owner.
          hmarker = '    "Configurations"\n    {'
          hinsert = hierarchy(word_proj_key, '_5842C61315664184B0EAF373A394AFB7')
          hinsert += hierarchy(excel_proj_key, '_5842C61315664184B0EAF373A394AFB7')
          s = s.replace(hmarker, hinsert + hmarker, 1)

          # File section: add VSTO deployment manifests explicitly.
          fmarker = '        "FileType"\n        {'
          finsert = file_block(word_vsto_key, r'..\\TarjimonOfficeUZ.Word\\bin\\Debug\\TarjimonOfficeUZ.Word.vsto', 'TarjimonOfficeUZ.Word.vsto')
          finsert += file_block(word_man_key, r'..\\TarjimonOfficeUZ.Word\\bin\\Debug\\TarjimonOfficeUZ.Word.dll.manifest', 'TarjimonOfficeUZ.Word.dll.manifest')
          finsert += file_block(excel_vsto_key, r'..\\TarjimonOfficeUZ.Excel\\bin\\Debug\\TarjimonOfficeUZ.Excel.vsto', 'TarjimonOfficeUZ.Excel.vsto')
          finsert += file_block(excel_man_key, r'..\\TarjimonOfficeUZ.Excel\\bin\\Debug\\TarjimonOfficeUZ.Excel.dll.manifest', 'TarjimonOfficeUZ.Excel.dll.manifest')
          s = s.replace(fmarker, finsert + fmarker, 1)

          # ProjectOutput section: include Word and Excel primary outputs.
          pomarker = '        "ProjectOutput"\n        {'
          pinsert = project_block(word_proj_key, r'..\\TarjimonOfficeUZ.Word\\obj\\Debug\\TarjimonOfficeUZ.Word.dll', word_guid)
          pinsert += project_block(excel_proj_key, r'..\\TarjimonOfficeUZ.Excel\\obj\\Debug\\TarjimonOfficeUZ.Excel.dll', excel_guid)
          s = s.replace(pomarker, pomarker + '\n' + pinsert, 1)

          # HKCU Office Add-ins registration.
          reg_marker = '            "HKCR"\n            {'
          def reg_tree(office, progid, friendly, prefix):
              return f'''            "{{60EA8692-D2D5-43EB-80DC-7906BF13D6EF}}:{prefix}"
            {{
            "Name" = "8:Software"
            "Condition" = "8:"
            "AlwaysCreate" = "11:FALSE"
            "DeleteAtUninstall" = "11:FALSE"
            "Transitive" = "11:FALSE"
                "Keys"
                {{
                    "{{60EA8692-D2D5-43EB-80DC-7906BF13D6EF}}:{prefix}MS"
                    {{
                    "Name" = "8:Microsoft"
                    "Condition" = "8:"
                    "AlwaysCreate" = "11:FALSE"
                    "DeleteAtUninstall" = "11:FALSE"
                    "Transitive" = "11:FALSE"
                        "Keys"
                        {{
                            "{{60EA8692-D2D5-43EB-80DC-7906BF13D6EF}}:{prefix}OF"
                            {{
                            "Name" = "8:Office"
                            "Condition" = "8:"
                            "AlwaysCreate" = "11:FALSE"
                            "DeleteAtUninstall" = "11:FALSE"
                            "Transitive" = "11:FALSE"
                                "Keys"
                                {{
                                    "{{60EA8692-D2D5-43EB-80DC-7906BF13D6EF}}:{prefix}AP"
                                    {{
                                    "Name" = "8:{office}"
                                    "Condition" = "8:"
                                    "AlwaysCreate" = "11:FALSE"
                                    "DeleteAtUninstall" = "11:FALSE"
                                    "Transitive" = "11:FALSE"
                                        "Keys"
                                        {{
                                            "{{60EA8692-D2D5-43EB-80DC-7906BF13D6EF}}:{prefix}AD"
                                            {{
                                            "Name" = "8:Addins"
                                            "Condition" = "8:"
                                            "AlwaysCreate" = "11:FALSE"
                                            "DeleteAtUninstall" = "11:FALSE"
                                            "Transitive" = "11:FALSE"
                                                "Keys"
                                                {{
                                                    "{{60EA8692-D2D5-43EB-80DC-7906BF13D6EF}}:{prefix}PR"
                                                    {{
                                                    "Name" = "8:{progid}"
                                                    "Condition" = "8:"
                                                    "AlwaysCreate" = "11:FALSE"
                                                    "DeleteAtUninstall" = "11:TRUE"
                                                    "Transitive" = "11:FALSE"
                                                        "Keys"
                                                        {{
                                                        }}
                                                        "Values"
                                                        {{
                                                            "{{ADCFDA98-8FDD-45E4-90BC-E3D20B029870}}:{prefix}FN"
                                                            {{
                                                            "Name" = "8:FriendlyName"
                                                            "Condition" = "8:"
                                                            "Transitive" = "11:FALSE"
                                                            "ValueTypes" = "3:1"
                                                            "Value" = "8:{friendly}"
                                                            }}
                                                            "{{ADCFDA98-8FDD-45E4-90BC-E3D20B029870}}:{prefix}DS"
                                                            {{
                                                            "Name" = "8:Description"
                                                            "Condition" = "8:"
                                                            "Transitive" = "11:FALSE"
                                                            "ValueTypes" = "3:1"
                                                            "Value" = "8:Tarjimon Office UZ - {office} tarjimon add-in"
                                                            }}
                                                            "{{ADCFDA98-8FDD-45E4-90BC-E3D20B029870}}:{prefix}LB"
                                                            {{
                                                            "Name" = "8:LoadBehavior"
                                                            "Condition" = "8:"
                                                            "Transitive" = "11:FALSE"
                                                            "ValueTypes" = "3:3"
                                                            "Value" = "3:3"
                                                            }}
                                                            "{{ADCFDA98-8FDD-45E4-90BC-E3D20B029870}}:{prefix}MF"
                                                            {{
                                                            "Name" = "8:Manifest"
                                                            "Condition" = "8:"
                                                            "Transitive" = "11:FALSE"
                                                            "ValueTypes" = "3:1"
                                                            "Value" = "8:file:///[TARGETDIR]{progid}.vsto|vstolocal"
                                                            }}
                                                        }}
                                                    }}
                                                }}
                                                "Values"
                                                {{
                                                }}
                                            }}
                                        }}
                                        "Values"
                                        {{
                                        }}
                                    }}
                                }}
                                "Values"
                                {{
                                }}
                            }}
                        }}
                        "Values"
                        {{
                        }}
                    }}
                }}
                "Values"
                {{
                }}
            }}
'''

          # Put Word and Excel trees under HKCU before HKCR.
          hkcu_end = '            "HKCR"\n            {'
          word_reg = reg_tree('Word', 'TarjimonOfficeUZ.Word', 'Tarjimon Office UZ (Word)', '_TW')
          excel_reg = reg_tree('Excel', 'TarjimonOfficeUZ.Excel', 'Tarjimon Office UZ (Excel)', '_TE')
          # reg_tree returns a Software root; insert both under HKCU Keys, not as sibling HKCU roots.
          keys_marker = '                "Keys"\n                {\n                }\n            }\n            "HKCR"'
          if keys_marker not in s:
              raise SystemExit('HKCU marker not found')
          combined = '                "Keys"\n                {\n' + word_reg.replace('            ', '                    ', 1).replace('            "', '                    "', 0) + excel_reg.replace('            ', '                    ', 1) + '                }\n            }\n            "HKCR"'
          # Safer direct replacement using a complete HKCU block prefix.
          old = '            "HKCU"\n            {\n                "Keys"\n                {\n                }\n            }\n            "HKCR"'
          new = '            "HKCU"\n            {\n                "Keys"\n                {\n' + word_reg.replace('            ', '                    ', 1) + excel_reg.replace('            ', '                    ', 1) + '                }\n            }\n            "HKCR"'
          s = s.replace(old, new, 1)

          p.write_text('\ufeff' + s.lstrip('\ufeff'), encoding='utf-8', newline='')
          print('vdproj patched')

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarjimonOfficeUZ.Setup/TarjimonOfficeUZ.Setup.vdproj .github/workflows/fix-vdproj-office-addins.yml
          git commit -m "Include Word and Excel add-ins in MSI"
          git push
