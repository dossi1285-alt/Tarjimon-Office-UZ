name: One-time Preflight metadata and UI update

on:
  push:
    branches:
      - release/1.0-installer-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0-installer-cleanup
          fetch-depth: 0

      - name: Update Preflight source
        shell: python
        run: |
          from pathlib import Path
          p = Path('TarjimonOfficeUZ.Setup.Preflight/Program.cs')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('list.Columns.Add("Qo\'shimcha nomi", 225); list.Columns.Add("Ishlab chiqaruvchi", 175);',
               'list.Columns.Add("Mahsulot nomi", 225); list.Columns.Add("Ishlab chiqaruvchi", 175);'),
              ('list.Columns.Add("Versiya", 75); list.Columns.Add("Dastur", 115); list.Columns.Add("Ishonch", 70); list.Columns.Add("Aniqlash asosi", 350);',
               'list.Columns.Add("Versiya", 75); list.Columns.Add("Dastur", 115); list.Columns.Add("Ishonch", 70); list.Columns.Add("Muallif / ishlab chiquvchi", 350);'),
              ('row.SubItems.Add(item.Host);',
               'row.SubItems.Add(DisplayHost(item.Host));'),
              ('row.SubItems.Add(item.Evidence);',
               'row.SubItems.Add(ResolveDeveloper(item));'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected source text not found: {old}')
              s = s.replace(old, new, 1)

          marker = '        private static string ExtractProductCode(string commandLine)\n'
          helper = '''        private static string ResolveDeveloper(AddinCandidate item)\n        {\n            if (item.IsOwnProduct) return "Dostonjon Ashurov";\n            return string.IsNullOrWhiteSpace(item.Publisher) ? "Aniqlanmagan" : item.Publisher;\n        }\n\n        private static string DisplayHost(string host)\n        {\n            if (string.IsNullOrWhiteSpace(host)) return string.Empty;\n            var parts = host.Split(new[] { ',', '/' }, StringSplitOptions.RemoveEmptyEntries)\n                .Select(x => x.Trim())\n                .Where(x => !x.Equals("Windows", StringComparison.OrdinalIgnoreCase) &&\n                            !x.Equals("Office", StringComparison.OrdinalIgnoreCase) &&\n                            !x.Equals("Office/Windows", StringComparison.OrdinalIgnoreCase))\n                .Distinct(StringComparer.OrdinalIgnoreCase)\n                .ToArray();\n            return string.Join(", ", parts);\n        }\n\n'''
          if marker not in s:
              raise SystemExit('Insert marker not found.')
          s = s.replace(marker, helper + marker, 1)

          p.write_text(s, encoding='utf-8', newline='')

      - name: Remove one-time workflow and commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-preflight-metadata-ui.yml
          git add TarjimonOfficeUZ.Setup.Preflight/Program.cs .github/workflows/one-time-preflight-metadata-ui.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refine Preflight product and developer metadata"
          git push origin HEAD:release/1.0-installer-cleanup
