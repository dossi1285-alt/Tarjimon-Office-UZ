name: One-time UI text cleanup

on:
  push:
    branches:
      - release/1.0-installer-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0-installer-cleanup
          fetch-depth: 0

      - name: Remove non-UI technical text
        shell: python
        run: |
          from pathlib import Path
          p = Path('TarjimonOfficeUZ.Setup.Preflight/Program.cs')
          s = p.read_text(encoding='utf-8')
          old1 = 'Text = "Kompyuteringizda Office bilan bog\'liq yoki funksional tarjimon/konvertorlar aniqlandi. Belgilanmaganlari saqlanadi.",'
          old2 = 'Text = "Mahsulot himoyalangan — o\'rnatish uchun belgilangan.",'
          new1 = 'Text = "",'
          new2 = 'Text = "",'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected UI strings were not found; no source change made.')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8', newline='')

      - name: Commit source change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-ui-patch.yml
          git add TarjimonOfficeUZ.Setup.Preflight/Program.cs .github/workflows/one-time-ui-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove technical text from Preflight UI"
          git push origin HEAD:release/1.0-installer-cleanup
