name: One-time button spacing cleanup

on:
  push:
    branches:
      - release/1.0-installer-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0-installer-cleanup
          fetch-depth: 0
      - name: Add right margin to dialog buttons
        shell: python
        run: |
          from pathlib import Path
          p = Path('TarjimonOfficeUZ.Setup.Preflight/Program.cs')
          s = p.read_text(encoding='utf-8')
          old = 'Action layoutButtons = () => { cancel.Left = panel.ClientSize.Width - cancel.Width; confirm.Left = cancel.Left - confirm.Width - 10; cancel.Top = 7; confirm.Top = 7; };'
          new = 'Action layoutButtons = () => { cancel.Left = panel.ClientSize.Width - cancel.Width - 10; confirm.Left = cancel.Left - confirm.Width - 10; cancel.Top = 7; confirm.Top = 7; };'
          if old not in s:
              raise SystemExit('Expected button layout line was not found; no source change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='')
      - name: Commit source change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-button-spacing.yml
          git add TarjimonOfficeUZ.Setup.Preflight/Program.cs .github/workflows/one-time-button-spacing.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add right margin to Preflight action buttons"
          git push origin HEAD:release/1.0-installer-cleanup
